name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 30

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/results.xml
          check_name: Playwright Test Results (Node ${{ matrix.node-version }})

  test-report:
    name: Test Report
    needs: test
    runs-on: ubuntu-latest
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Comment PR with test summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            let comment = '## 🧪 Playwright Test Results\n\n';
            comment += '| Status | Details |\n|--------|----------|\n';
            comment += '| ✅ Tests Executed | Check artifacts for detailed results |\n';
            comment += '| 📊 Reports | Available in job artifacts |\n';
            comment += '| 🌐 Browsers | Chromium, Firefox, WebKit, Mobile |\n\n';
            comment += '### 📋 Test Coverage\n';
            comment += '- Navigation & UI\n';
            comment += '- Hero Section\n';
            comment += '- Page Sections\n';
            comment += '- Responsiveness (Mobile/Desktop)\n';
            comment += '- SEO & Metadata\n';
            comment += '- Dark Mode\n';
            comment += '- Accessibility\n';
            comment += '- Performance\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check test status
        run: echo "All tests completed. Check artifacts for detailed reports."